<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eebox</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0c10;
        --panel: #14161d;
        --border: #262b36;
        --text: #e7e9ef;
        --text-dim: #9aa1b3;
        --accent: #f5c518;
        --accent-ink: #14161d;
        --error: #f87171;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      body { display: flex; flex-direction: column; }
      header {
        position: relative;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        padding: 6px 10px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      header strong { color: var(--accent); margin-right: 8px; }
      button, select, .file-button {
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 3px 10px;
        cursor: pointer;
      }
      button.active { border-color: var(--accent); color: var(--accent); }
      .toolbar-group { display: flex; gap: 4px; }
      .toolbar-separator { align-self: stretch; width: 1px; margin: 2px 4px; background: var(--border); }
      .menu { position: relative; }
      .menu-button::after { content: ' \25BE'; color: var(--text-dim); }
      .menu-button[aria-expanded='true'] { border-color: var(--accent); color: var(--accent); }
      .menu-list {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        z-index: 40;
        min-width: 260px;
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 4px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      }
      .menu-list[hidden] { display: none; }
      .menu-list hr { width: 100%; margin: 4px 0; border: 0; border-top: 1px solid var(--border); }
      .wide-button { width: 100%; margin-bottom: 6px; }
      .module { position: relative; }
      .module-action { display: none; position: absolute; right: 4px; top: 50%; transform: translateY(-50%); padding: 0 6px; font-size: 11px; }
      .module:hover .module-action { display: inline-block; }
      .designer-dialog { width: min(1060px, 96vw); }
      .designer-body { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
      .designer-stage { overflow: auto; padding: 12px; }
      .designer-svg { display: block; max-width: 100%; height: auto; cursor: crosshair; touch-action: none; user-select: none; }
      .designer-pin { cursor: grab; }
      .designer-form-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0; }
      .designer-form-row input[type='number'], .designer-form-row input[type='text'], .designer-form-row select { width: 160px; }
      .designer-toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      .designer-width { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--text-dim); font-size: 12px; }
      .designer-width input { flex: 1; max-width: 240px; }
      .designer-rail { display: block; max-width: 100%; margin-top: 4px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); }
      .designer-hint { color: var(--text-dim); font-size: 12px; margin: 10px 0 0; }
      .face-layers { margin-bottom: 8px; }
      .face-layers h3 { margin: 6px 0; }
      .face-layer { display: block; width: 100%; margin: 2px 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .face-layer.selected { border-color: var(--accent); color: var(--accent); }
      .designer-template { margin-left: 8px; color: var(--text-dim); }
      .designer-fields { overflow-y: auto; padding: 8px 14px; border-left: 1px solid var(--border); }
      .examples-dialog { width: min(560px, 94vw); }
      .examples-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
      .example-item { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 8px 10px; }
      .example-item span { color: var(--text-dim); font-size: 12px; }
      .app-dialog.settings-dialog { width: min(820px, 96vw); max-width: 96vw; }
      .settings-scroll { max-height: min(62vh, 560px); overflow-y: auto; padding-right: 6px; }
      .settings-group { margin: 0 0 14px; }
      .settings-group h3 { margin: 0 0 4px; font-size: 13px; }
      .settings-hint { margin: 0 0 8px; color: var(--text-dim); font-size: 12px; }
      .settings-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
      .settings-table th { padding: 2px 3px; font-size: 11px; font-weight: 500; color: var(--text-dim); text-align: center; }
      .settings-table th:first-child, .settings-table td:first-child { width: 150px; text-align: left; font-size: 12px; white-space: normal; }
      .settings-table td:first-child { white-space: nowrap; }
      .settings-table td { padding: 1px 2px; }
      .settings-table tr.first-of-method td { border-top: 1px solid var(--border); }
      .settings-table input, .settings-field input { width: 100%; box-sizing: border-box; padding: 2px 4px; font: inherit; text-align: right; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 3px; }
      .settings-table input.changed, .settings-field input.changed { border-color: var(--accent); }
      .settings-table input.invalid, .settings-field input.invalid { border-color: var(--error); background: rgba(239, 68, 68, 0.12); }
      .settings-field { display: grid; grid-template-columns: 150px 90px auto; gap: 8px; align-items: center; margin: 3px 0; }
      .settings-label { font-size: 12px; }
      .settings-unit { color: var(--text-dim); font-size: 12px; }
      .settings-trips { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); column-gap: 16px; }
      .app-dialog.colours-dialog { width: min(760px, 96vw); max-width: 96vw; }
      .colours-chooser { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
      .colours-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
      .colours-table th { padding: 2px 6px; font-size: 11px; font-weight: 500; color: var(--text-dim); text-align: left; }
      .colours-table td { padding: 3px 6px; border-top: 1px solid var(--border); vertical-align: middle; }
      .colours-meaning { color: var(--text-dim); font-size: 12px; }
      .colours-table input[type='color'] { width: 38px; height: 24px; padding: 0; background: none; border: 1px solid var(--border); border-radius: 3px; }
      .colours-table input[type='checkbox'] { margin-right: 6px; vertical-align: middle; }
      .colour-ground { display: flex; align-items: center; width: 90px; height: 26px; padding: 0 8px; border: 1px solid var(--border); border-radius: 3px; }
      .colour-wire { width: 100%; height: 6px; border-radius: 3px; }
      .settings-actions { justify-content: space-between; align-items: center; }
      .settings-actions .settings-files { display: flex; gap: 8px; margin-right: auto; }
      .settings-dialog .editor-errors { max-height: 120px; margin: 6px 0; padding: 4px 0; border: 0; }
      .menu-row { display: flex; gap: 6px; padding: 2px 0; }
      .menu-row select { flex: 1; min-width: 0; }
      .menu-list .menu-item { display: block; width: 100%; padding: 5px 10px; text-align: left; background: transparent; border: 0; border-radius: 4px; }
      .menu-list .menu-item:hover:not(:disabled), .menu-list .menu-item:focus-visible { background: var(--bg); outline: none; }
      body[data-mode='panel'] .schematic-only,
      body[data-mode='schematic'] .panel-only,
      body[data-mode='schematic'] #sidebar { display: none; }
      body.hide-sidebar #sidebar, body.hide-inspector #inspector { display: none; }
      #inspector {
        width: 270px;
        flex: 0 0 auto;
        overflow-y: auto;
        padding: 8px 10px;
        background: var(--panel);
        border-left: 1px solid var(--border);
      }
      #inspector h3 { margin: 0 0 8px; font-size: 13px; }
      .inspector-actions { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
      .inspector-actions.first { margin: 8px 0 14px; }
      .inspector-field { display: grid; grid-template-columns: 88px 1fr; gap: 6px; margin: 5px 0; align-items: start; }
      .inspector-field > label { color: var(--text-dim); padding-top: 3px; }
      .inspector-control input[type='text'],
      .inspector-control input[type='number'] {
        width: 100%;
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 6px;
      }
      .inspector-value { padding-top: 3px; overflow-wrap: anywhere; }
      .inspector-hint { color: var(--text-dim); font-size: 11px; }
      .inspector-choices { display: flex; flex-wrap: wrap; gap: 2px 10px; padding-top: 3px; }
      button:hover:not(:disabled), .file-button:hover { border-color: var(--accent); }
      button:disabled { opacity: 0.4; cursor: default; }
      .hint { flex-basis: 100%; color: var(--text-dim); font-size: 12px; }
      /* An overlay under the toolbar, so a long message does not stretch the toolbar and shift the drawing. */
      #status {
        position: absolute;
        top: 100%;
        right: 290px;
        z-index: 30;
        max-width: min(560px, 60vw);
        margin-top: 4px;
        padding: 4px 10px;
        color: var(--text-dim);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        white-space: pre-line;
        text-align: left;
        pointer-events: none;
      }
      #status:empty { display: none; }
      #status.error { color: var(--error); border-color: var(--error); }
      main { flex: 1; display: flex; min-height: 0; }
      #sidebar {
        width: 240px;
        flex: 0 0 auto;
        overflow-y: auto;
        padding: 8px;
        background: var(--panel);
        border-right: 1px solid var(--border);
      }
      .library-title {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 8px 0 4px;
        font-weight: 600;
      }
      .library-title span { flex: 1; overflow: hidden; text-overflow: ellipsis; }
      .library-title button { padding: 0 6px; font-size: 11px; }
      .module {
        padding: 4px 8px;
        margin-bottom: 3px;
        border: 1px solid var(--border);
        border-radius: 4px;
        cursor: grab;
        user-select: none;
        touch-action: none;
      }
      .module:hover { border-color: var(--accent); }
      .module small { color: var(--text-dim); }
      #palette .hint { color: var(--text-dim); }
      #palette-search {
        width: 100%;
        margin: 8px 0 4px;
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 3px 8px;
      }
      .palette-group { margin: 2px 0; }
      .palette-group > summary { cursor: pointer; color: var(--text-dim); padding: 2px 0; user-select: none; }
      .library-title small, .library-title a { color: var(--text-dim); font-weight: normal; font-size: 11px; }
      #panel-settings { padding-bottom: 8px; border-bottom: 1px solid var(--border); }
      #shelf { padding: 8px 0; border-bottom: 1px solid var(--border); }
      #shelf h3 { margin: 0 0 6px; font-size: 13px; }
      #shelf .hint { flex-basis: auto; }
      .shelf-item { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
      .shelf-item button { padding: 0 6px; }
      #panel-settings h3 { margin: 0 0 6px; font-size: 13px; }
      .settings-line { display: flex; align-items: center; gap: 4px; margin: 3px 0; }
      .settings-line input { width: 64px; font: inherit; color: var(--text); background: var(--bg);
        border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; }
      .settings-line button { padding: 0 6px; }
      .settings-line input.row-label { width: 100%; }
      .settings-gap { color: var(--text-dim); padding-left: 12px; }
      .app-dialog {
        max-width: 420px;
        padding: 16px 18px;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .app-dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
      #print-sheet { display: none; }
      @media print {
        @page { size: A4 landscape; margin: 10mm; }
        :root { color-scheme: light; }
        html, body { background: #fff; color: #000; height: auto; overflow: visible; }
        body > *:not(#print-sheet) { display: none !important; }
        #print-sheet { display: block; }
        #print-sheet h1 { font-size: 18pt; margin: 0 0 6mm; break-after: avoid; }
        #print-sheet h2 { font-size: 14pt; margin: 7mm 0 3mm; }
        #print-sheet h2:first-child { margin-top: 0; }
        #print-sheet figure { margin: 0; break-after: page; break-inside: avoid; }
        #print-sheet svg { width: 100%; height: auto; max-height: 150mm; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
        #print-sheet figcaption { font-size: 9pt; margin-top: 2mm; }
        #print-sheet table { width: 100%; border-collapse: collapse; font-size: 9pt; }
        #print-sheet th, #print-sheet td { border: 1px solid #000; padding: 1mm 2mm; text-align: left; }
        #print-sheet tr { break-inside: avoid; }
        #print-sheet .tile { position: relative; width: 276mm; height: 188mm; overflow: hidden; break-after: page; break-inside: avoid; outline: 0.2mm solid #000; }
        #print-sheet .tile-drawing { position: absolute; }
        #print-sheet .tile-drawing svg { max-height: none; display: block; }
        #print-sheet .tile-guide-x { position: absolute; top: 0; bottom: 0; border-left: 0.2mm dashed #888; }
        #print-sheet .tile-guide-y { position: absolute; left: 0; right: 0; border-top: 0.2mm dashed #888; }
        #print-sheet .tile-caption { position: absolute; left: 2mm; bottom: 1mm; font-size: 7pt; background: #fff; padding: 0 1mm; }
        #print-sheet .bom-total { margin: 2mm 0 0; font-size: 10pt; font-weight: 600; }
        .label-heading { margin: 0 0 4mm; font-size: 12pt; }
        .strip-line { margin-bottom: 5mm; break-inside: avoid; }
        .strip-rail { font-size: 8pt; margin-bottom: 1mm; }
        .strip-rail-cells { position: relative; height: 14mm; }
        .strip-cell { position: absolute; top: 0; height: 14mm; box-sizing: border-box; padding: 0.6mm; border: 0.3mm dashed #000; font-size: 6.5pt; line-height: 1.15; overflow: hidden; overflow-wrap: anywhere; text-align: center; display: flex; align-items: center; justify-content: center; }
        .marker-grid { display: flex; flex-wrap: wrap; gap: 3mm; }
        .marker { box-sizing: border-box; width: 42mm; height: 10mm; padding: 0.8mm 1.5mm; border: 0.3mm dashed #000; font-size: 8pt; line-height: 1.2; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
        .marker-detail { font-size: 6.5pt; }
      }
      .app-dialog p { margin: 0 0 14px; }
      .editor-dialog { width: min(1100px, 94vw); height: min(760px, 88vh); max-width: none; padding: 0; overflow: hidden; }
      .editor-dialog[open] { display: grid; grid-template-rows: auto 1fr auto; }
      .editor-dialog header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); }
      .editor-dialog header h2 { margin: 0 8px 0 0; font-size: 14px; }
      .editor-status { flex: 1; color: var(--text-dim); }
      .editor-status.error { color: var(--error); }
      .editor-body { display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
      .editor-list { overflow-y: auto; padding: 8px; border-right: 1px solid var(--border); }
      .editor-list h3 { margin: 12px 0 4px; font-size: 12px; color: var(--text-dim); }
      .editor-list input[type='search'] { width: 100%; margin: 6px 0; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; }
      .editor-tools { display: flex; gap: 6px; }
      .editor-tools select { flex: 1; min-width: 0; }
      .editor-item { padding: 2px 8px; border-radius: 4px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .editor-item:hover { background: var(--bg); }
      .editor-item.selected { background: var(--bg); outline: 1px solid var(--accent); }
      .editor-item.failed::after { content: ' !'; color: var(--error); }
      .editor-fields { overflow-y: auto; padding: 8px 14px; }
      .editor-fields select, .inspector-control select { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; }
      .editor-errors { max-height: 140px; overflow-y: auto; padding: 6px 12px; border-top: 1px solid var(--border); color: var(--error); white-space: pre-line; font-size: 12px; }
      .editor-errors:empty { display: none; }
      .app-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
      button.primary { border-color: var(--accent); color: var(--accent); }
      #stage { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
      #stage-wrap { flex: 1; min-width: 0; position: relative; }
      #stage-wrap.drop::after {
        content: 'Drop library JSON';
        position: absolute;
        inset: 8px;
        display: grid;
        place-items: center;
        border: 2px dashed var(--accent);
        color: var(--accent);
        font-size: 18px;
        pointer-events: none;
      }
    </style>
  </head>
  <body data-mode="panel">
    <header>
      <strong>eebox</strong>
      <div class="toolbar-group">
        <button id="mode-panel">Panel</button>
        <button id="mode-schematic">Schematic</button>
      </div>
      <div class="menu">
        <button class="menu-button" aria-haspopup="menu" aria-expanded="false">File</button>
        <div class="menu-list" role="menu" hidden>
          <div class="menu-row panel-only">
            <select id="enclosure" title="Enclosure"></select>
            <button id="new-panel">New panel</button>
          </div>
          <hr class="panel-only" />
          <label class="menu-item file-button" role="menuitem" tabindex="0">
            Open…
            <input id="open-project" type="file" accept=".json,application/json" hidden />
          </label>
          <button class="menu-item" role="menuitem" id="open-example" title="Open one of the bundled example projects">Examples…</button>
          <button class="menu-item" role="menuitem" id="save-project">Save</button>
          <button class="menu-item" role="menuitem" id="share-link">Share link</button>
          <hr />
          <button class="menu-item" role="menuitem" id="colour-scheme" title="Choose the colours of phases, neutral and earth, or set your own">Colours…</button>
          <button class="menu-item" role="menuitem" id="cable-settings" title="Edit the cable table and the voltage drop norms">Cable settings…</button>
          <button class="menu-item" role="menuitem" id="new-library" title="Start a library of your own">New library…</button>
          <label class="menu-item file-button" role="menuitem" tabindex="0">
            Import library or parts (CSV)…
            <input id="import" type="file" accept=".json,.csv,application/json,text/csv" multiple hidden />
          </label>
        </div>
      </div>
      <div class="menu">
        <button class="menu-button" aria-haspopup="menu" aria-expanded="false">Export</button>
        <div class="menu-list" role="menu" hidden>
          <button class="menu-item" role="menuitem" id="export-png">PNG image</button>
          <button class="menu-item" role="menuitem" id="export-svg">SVG image</button>
          <button class="menu-item" role="menuitem" id="export-bom">Parts list (CSV)</button>
          <button class="menu-item" role="menuitem" id="export-wires" title="Every wire with its two ends, conductor, cross-section, length and current">Wire list (CSV)</button>
          <button class="menu-item" role="menuitem" id="export-wire-labels" title="One label for each end of each wire, for a label printer: semicolon-separated, UTF-8">Wire end labels (CSV)</button>
          <button class="menu-item" role="menuitem" id="export-circuits" title="Loads with their breaker, cable and voltage drop, and the ferrules needed">Circuits and ferrules (CSV)</button>
          <hr />
          <button class="menu-item" role="menuitem" id="print" title="Print the panel, the schematic and the lists">Print…</button>
          <button class="menu-item" role="menuitem" id="print-full-size" title="Print the panel at 1:1 on overlapping A4 sheets to glue together">Print full size…</button>
          <button class="menu-item" role="menuitem" id="print-labels" title="Print labels for the modules at actual size and markers for the cables">Print labels…</button>
        </div>
      </div>
      <div class="menu schematic-only">
        <button class="menu-button" aria-haspopup="menu" aria-expanded="false">Nodes</button>
        <div class="menu-list" role="menu" hidden>
          <button class="menu-item" role="menuitem" id="add-source1" title="Single-phase mains: L, N, PE">Source, 1 phase</button>
          <button class="menu-item" role="menuitem" id="add-source3" title="Three-phase mains: L1, L2, L3, N, PE">Source, 3 phases</button>
          <button class="menu-item" role="menuitem" id="add-sourcePen1" title="Single-phase mains with a PEN conductor (TN-C-S): L, PEN">Source, 1 phase, PEN</button>
          <button class="menu-item" role="menuitem" id="add-sourcePen" title="Three-phase mains with a PEN conductor (TN-C-S): L1, L2, L3, PEN">Source, 3 phases, PEN</button>
          <button class="menu-item" role="menuitem" id="add-load1" title="Single-phase consumer: L, N, PE">Load, 1 phase</button>
          <button class="menu-item" role="menuitem" id="add-load3" title="Three-phase consumer: L1, L2, L3, N, PE">Load, 3 phases</button>
          <button class="menu-item" role="menuitem" id="add-earthElectrode" title="An earth electrode; tick PEN instead of PE for a repeated earthing of a PEN conductor">Earth electrode</button>
          <hr />
          <button class="menu-item" role="menuitem" id="sync-modules" title="Add a node for every module on the panel">Sync modules</button>
          <button class="menu-item" role="menuitem" id="spread-wires" title="Move apart the wires that run on top of each other">Separate overlapping wires</button>
          <button class="menu-item" role="menuitem" id="route-automatically" title="Take the hand-drawn routes off all wires and let the program route them">Route all wires automatically</button>
          <button class="menu-item" role="menuitem" id="remove-orphans" title="Remove nodes of modules that are gone from the panel, when they have no wires">Remove orphans</button>
        </div>
      </div>
      <span class="toolbar-separator"></span>
      <div class="toolbar-group">
        <button id="undo">Undo</button>
        <button id="redo">Redo</button>
        <button id="delete-selection" title="Remove the selected item (Delete)" disabled>Delete</button>
        <button id="fit">Fit</button>
        <button id="ruler" class="panel-only" title="Measure on the panel: drag from point to point; ends snap to edges (R)">Ruler</button>
      </div>
      <span class="toolbar-separator"></span>
      <span class="toolbar-separator"></span>
      <div class="toolbar-group">
        <button id="toggle-sidebar" class="panel-only" title="Show or hide the module library">Library</button>
        <button id="toggle-inspector" title="Show or hide the inspector">Inspector</button>
      </div>
      <span class="toolbar-separator"></span>
      <button id="check" title="Look for overlaps, orphaned nodes, wrongly joined conductors and design problems">Check</button>
      <button id="bundle-mode" class="schematic-only" title="While on, drag from a node to another node to wire all poles (same as Shift-drag)">Wire all poles</button>
      <div id="status"></div>
      <div class="hint schematic-only">Drag terminal to terminal to wire it. Shift-drag, or switch on Wire all poles, from node to node to wire every pole. Drag a wire to move it; drag its piece at a terminal sideways to bend it.</div>
    </header>
    <main>
      <aside id="sidebar">
        <section id="panel-settings"></section>
        <section id="shelf"></section>
        <button id="new-module" class="wide-button" title="Design a module of your own">New module…</button>
        <input id="palette-search" type="search" placeholder="Search modules: c16 2p, 30ma, rcd…" autocomplete="off" />
        <div id="palette"></div>
      </aside>
      <div id="stage-wrap"><canvas id="stage"></canvas></div>
      <aside id="inspector"><div id="inspector-content"></div></aside>
    </main>
    <div id="print-sheet"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
