<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eebox</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0c10;
        --panel: #14161d;
        --border: #262b36;
        --text: #e7e9ef;
        --text-dim: #9aa1b3;
        --accent: #f5c518;
        --accent-ink: #14161d;
        --error: #f87171;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      body { display: flex; flex-direction: column; }
      header {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        padding: 6px 10px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      header strong { color: var(--accent); margin-right: 8px; }
      button, select, .file-button {
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 3px 10px;
        cursor: pointer;
      }
      button.active { border-color: var(--accent); color: var(--accent); }
      body[data-mode='panel'] .schematic-only,
      body[data-mode='schematic'] .panel-only,
      body[data-mode='schematic'] #sidebar { display: none; }
      #inspector {
        width: 270px;
        flex: 0 0 auto;
        overflow-y: auto;
        padding: 8px 10px;
        background: var(--panel);
        border-left: 1px solid var(--border);
      }
      #inspector h3 { margin: 0 0 8px; font-size: 13px; }
      .inspector-actions { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
      .inspector-field { display: grid; grid-template-columns: 88px 1fr; gap: 6px; margin: 5px 0; align-items: start; }
      .inspector-field > label { color: var(--text-dim); padding-top: 3px; }
      .inspector-control input[type='text'],
      .inspector-control input[type='number'] {
        width: 100%;
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 6px;
      }
      .inspector-value { padding-top: 3px; overflow-wrap: anywhere; }
      .inspector-hint { color: var(--text-dim); font-size: 11px; }
      .inspector-choices { display: flex; flex-wrap: wrap; gap: 2px 10px; padding-top: 3px; }
      button:hover:not(:disabled), .file-button:hover { border-color: var(--accent); }
      button:disabled { opacity: 0.4; cursor: default; }
      .hint { flex-basis: 100%; color: var(--text-dim); font-size: 12px; }
      #status { color: var(--text-dim); margin-left: auto; white-space: pre-line; text-align: right; }
      #status.error { color: var(--error); }
      main { flex: 1; display: flex; min-height: 0; }
      #sidebar {
        width: 240px;
        flex: 0 0 auto;
        overflow-y: auto;
        padding: 8px;
        background: var(--panel);
        border-right: 1px solid var(--border);
      }
      .library-title {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 8px 0 4px;
        font-weight: 600;
      }
      .library-title span { flex: 1; overflow: hidden; text-overflow: ellipsis; }
      .library-title button { padding: 0 6px; font-size: 11px; }
      .module {
        padding: 4px 8px;
        margin-bottom: 3px;
        border: 1px solid var(--border);
        border-radius: 4px;
        cursor: grab;
        user-select: none;
        touch-action: none;
      }
      .module:hover { border-color: var(--accent); }
      .module small { color: var(--text-dim); }
      #palette .hint { color: var(--text-dim); }
      #palette-search {
        width: 100%;
        margin: 8px 0 4px;
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 3px 8px;
      }
      .palette-group { margin: 2px 0; }
      .palette-group > summary { cursor: pointer; color: var(--text-dim); padding: 2px 0; user-select: none; }
      .library-title small, .library-title a { color: var(--text-dim); font-weight: normal; font-size: 11px; }
      #panel-settings { padding-bottom: 8px; border-bottom: 1px solid var(--border); }
      #shelf { padding: 8px 0; border-bottom: 1px solid var(--border); }
      #shelf h3 { margin: 0 0 6px; font-size: 13px; }
      #shelf .hint { flex-basis: auto; }
      .shelf-item { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
      .shelf-item button { padding: 0 6px; }
      #panel-settings h3 { margin: 0 0 6px; font-size: 13px; }
      .settings-line { display: flex; align-items: center; gap: 4px; margin: 3px 0; }
      .settings-line input { width: 64px; font: inherit; color: var(--text); background: var(--bg);
        border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; }
      .settings-line button { padding: 0 6px; }
      .settings-line input.row-label { width: 100%; }
      .settings-gap { color: var(--text-dim); padding-left: 12px; }
      .app-dialog {
        max-width: 420px;
        padding: 16px 18px;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .app-dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
      .app-dialog p { margin: 0 0 14px; }
      .editor-dialog { width: min(1100px, 94vw); height: min(760px, 88vh); max-width: none; padding: 0; overflow: hidden; }
      .editor-dialog[open] { display: grid; grid-template-rows: auto 1fr auto; }
      .editor-dialog header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); }
      .editor-dialog header h2 { margin: 0 8px 0 0; font-size: 14px; }
      .editor-status { flex: 1; color: var(--text-dim); }
      .editor-status.error { color: var(--error); }
      .editor-body { display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
      .editor-list { overflow-y: auto; padding: 8px; border-right: 1px solid var(--border); }
      .editor-list h3 { margin: 12px 0 4px; font-size: 12px; color: var(--text-dim); }
      .editor-list input[type='search'] { width: 100%; margin: 6px 0; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; }
      .editor-tools { display: flex; gap: 6px; }
      .editor-tools select { flex: 1; min-width: 0; }
      .editor-item { padding: 2px 8px; border-radius: 4px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .editor-item:hover { background: var(--bg); }
      .editor-item.selected { background: var(--bg); outline: 1px solid var(--accent); }
      .editor-item.failed::after { content: ' !'; color: var(--error); }
      .editor-fields { overflow-y: auto; padding: 8px 14px; }
      .editor-fields select, .inspector-control select { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; }
      .editor-errors { max-height: 140px; overflow-y: auto; padding: 6px 12px; border-top: 1px solid var(--border); color: var(--error); white-space: pre-line; font-size: 12px; }
      .editor-errors:empty { display: none; }
      .app-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
      button.primary { border-color: var(--accent); color: var(--accent); }
      #stage { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
      #stage-wrap { flex: 1; min-width: 0; position: relative; }
      #stage-wrap.drop::after {
        content: 'Drop library JSON';
        position: absolute;
        inset: 8px;
        display: grid;
        place-items: center;
        border: 2px dashed var(--accent);
        color: var(--accent);
        font-size: 18px;
        pointer-events: none;
      }
    </style>
  </head>
  <body data-mode="panel">
    <header>
      <strong>eebox</strong>
      <button id="mode-panel">Panel</button>
      <button id="mode-schematic">Schematic</button>
      <select id="enclosure" class="panel-only" title="Enclosure"></select>
      <button id="new-panel" class="panel-only">New panel</button>
      <button id="add-source1" class="schematic-only" title="Single-phase mains: L, N, PE">+ Source 1ph</button>
      <button id="add-source3" class="schematic-only" title="Three-phase mains: L1, L2, L3, N, PE">+ Source 3ph</button>
      <button id="add-load1" class="schematic-only" title="Single-phase consumer: L, N, PE">+ Load 1ph</button>
      <button id="add-load3" class="schematic-only" title="Three-phase consumer: L1, L2, L3, N, PE">+ Load 3ph</button>
      <button id="bundle-mode" class="schematic-only" title="While on, drag from a node to another node to wire all poles (same as Shift-drag)">Wire all poles</button>
      <button id="sync-modules" class="schematic-only" title="Add a node for every module on the panel">Sync modules</button>
      <button id="check" title="Look for overlaps, orphaned nodes and wrongly joined conductors">Check</button>
      <button id="undo">Undo</button>
      <button id="redo">Redo</button>
      <button id="delete-selection" title="Remove the selected item (Delete)" disabled>Delete</button>
      <button id="fit">Fit</button>
      <label class="file-button">
        Open…
        <input id="open-project" type="file" accept=".json,application/json" hidden />
      </label>
      <button id="save-project">Save</button>
      <button id="share-link">Share link</button>
      <button id="export-png">PNG</button>
      <button id="export-svg">SVG</button>
      <button id="export-bom">BOM CSV</button>
      <button id="new-library" title="Start a library of your own">New library…</button>
      <label class="file-button">
        Import library…
        <input id="import" type="file" accept=".json,application/json" multiple hidden />
      </label>
      <div id="status"></div>
      <div class="hint schematic-only">Drag terminal to terminal to wire it. Shift-drag, or switch on Wire all poles, from node to node to wire every pole.</div>
    </header>
    <main>
      <aside id="sidebar">
        <section id="panel-settings"></section>
        <section id="shelf"></section>
        <input id="palette-search" type="search" placeholder="Search modules: c16 2p, 30ma, rcd…" autocomplete="off" />
        <div id="palette"></div>
      </aside>
      <div id="stage-wrap"><canvas id="stage"></canvas></div>
      <aside id="inspector"><div id="inspector-content"></div></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
